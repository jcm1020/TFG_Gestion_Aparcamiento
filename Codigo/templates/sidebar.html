<!-- Asegurar la carga de iconos si los necesitamos -->
{% load static %}

<!--
	Variable local para la ruta actual de la pagina.
	Captura la ruta actual del navegador para usarla como 'path' dentro de este bloque.
    Esto facilitara la comparación con patrones de URL sin acceder directamente a 'request'.
	'path' se usa para conociendo la ruta establecer si debe estar abieto o no, activo o no el acordeon de HTML5 details.
-->
{% with request.path as path %}

	
<aside class="sidebar">

	<!-- 
    ========================
    SECCION DE USUARIOS (F1)    
    ========================
	-->
	<details class="sidebar-section" data-section="f1" {% if '/usuarios/' in path or path == '/' %}open{% endif %}>
		<summary>
			<i class="fa fa-users"></i> Usuarios
		</summary>
    
		<ul class="sidebar-menu">
			<!-- Enlace Activo: Lista -->
			<li>
				<a href="{% url 'usuarios:lista' %}" {% if '/usuarios/lista' in path %}class="active"{% endif %}>
					<i class="fa fa-list"></i> Listado de Usuarios
				</a>
			</li>

			<!-- Enlace Secundario: Crear -->
			<li>
				<a href="{% url 'usuarios:crear' %}" {% if '/usuarios/crear' in path %}class="active"{% endif %}>
					<i class="fa fa-plus-circle"></i> Crear Usuario
				</a>
			</li>
		</ul>
	</details>

	<!-- 
    ========================
    SECCION DE ESPACIOS (F2)
    ========================
	-->
	<details class="sidebar-section" data-section="f2" {% if '/espacios/' in path %}open{% endif %}>
		<summary>
			<i class="fa fa-parking"></i> Espacios
		</summary>
    
		<ul class="sidebar-menu">

			<!-- Enlace Activo: Lista -->
			<li>
				<a href="{% url 'usuarios:lista' %}" {% if '/espacios/' in path %}class="active"{% endif %}>
					<i class="fa fa-list"></i> Listado de Espacios
				</a>
			</li>

			<!-- Enlace Secundario: Crear -->
			<li>
				<a href="{% url 'usuarios:crear' %}" {% if '/espacios/crear' in path %}class="active"{% endif %}>
					<i class="fa fa-plus-circle"></i> Crear Espacio
				</a>
			</li>
		</ul>
	</details>
</aside>

{% endwith %}
